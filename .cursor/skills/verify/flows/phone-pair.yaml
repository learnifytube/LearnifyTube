appId: com.learnifytube.mobile
---
# Cold-launch straight into connect: it opens the same way whether the phone
# was on Home, the pair screen, or a splash, and a slow Metro bundle only
# stretches the wait.
- stopApp
- openLink: learnify://connect
- extendedWaitUntil:
    visible:
      id: connect-submit
    timeout: 90000
- tapOn:
    text: "OK"
    optional: true
- tapOn:
    id: connect-submit
- extendedWaitUntil:
    visible: "Little Science Lab"
    timeout: 30000
- takeScreenshot: phone-paired-home
- tapOn: "Floating and sinking"
- extendedWaitUntil:
    visible:
      id: player-back
    timeout: 20000
- takeScreenshot: phone-player
