appId: com.learnifytube.mobile
---
# Run after phone-pair.yaml. Covers See all + hardware Back, skipping through a
# row in the player, and the On this phone tab.
- launchApp
- extendedWaitUntil:
    visible:
      id: row-see-all-channel-UCverifyScience01
    timeout: 60000
- tapOn:
    id: row-see-all-channel-UCverifyScience01
- extendedWaitUntil:
    visible:
      id: row-grid-back
    timeout: 5000
- takeScreenshot: phone-see-all
# Hardware Back closes the grid instead of leaving the app.
- back
- extendedWaitUntil:
    visible:
      id: row-see-all-channel-UCverifyScience01
    timeout: 5000
- tapOn:
    id: row-see-all-channel-UCverifyScience01
- tapOn: "Floating and sinking"
- extendedWaitUntil:
    visible:
      id: player-back
    timeout: 20000
- takeScreenshot: phone-player-start
# While a video plays, the controls (and title) hide 3 s after a touch, and on
# the emulator one Maestro tap takes about that long, so it can land on the
# picture instead. Once playback has hidden them, pause and bring them back:
# paused controls stay up.
- extendedWaitUntil:
    notVisible:
      id: player-back
    timeout: 20000
- pressKey: Remote Media Play Pause
- tapOn:
    point: "50%,40%"
- tapOn:
    id: next-video
- extendedWaitUntil:
    notVisible:
      id: player-back
    timeout: 20000
- pressKey: Remote Media Play Pause
- tapOn:
    point: "50%,40%"
- extendedWaitUntil:
    visible: "Rainbows"
    timeout: 5000
- takeScreenshot: phone-player-next
- tapOn:
    id: previous-video
- extendedWaitUntil:
    notVisible:
      id: player-back
    timeout: 20000
- pressKey: Remote Media Play Pause
- tapOn:
    point: "50%,40%"
- extendedWaitUntil:
    visible: "Floating and sinking"
    timeout: 5000
# Back from the player lands on the grid it was opened from, then Home.
- back
- extendedWaitUntil:
    visible:
      id: row-grid-back
    timeout: 5000
- back
- extendedWaitUntil:
    visible:
      id: row-see-all-channel-UCverifyScience01
    timeout: 5000
- tapOn: "On this phone"
- extendedWaitUntil:
    visible: "Floating and sinking"
    timeout: 10000
- takeScreenshot: phone-on-this-phone
