name: Build Release APK

on:
  workflow_dispatch:
  push:
    tags:
      - "mobile-v*"

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android-apk:
    name: Build Android Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install dependencies
        working-directory: apps/mobile
        run: npm ci

      - name: Generate Android native project
        working-directory: apps/mobile
        run: |
          npx expo prebuild --platform android --clean --non-interactive

      # Release APKs must carry our own key, never the template debug key.
      # See apps/mobile/docs/adr/0001-release-apk-signed-with-own-key.md.
      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [[ -z "$ANDROID_KEYSTORE_BASE64" ]]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is missing; refusing to build a debug-signed release."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/learnify-release.keystore"

      - name: Build Release APK
        working-directory: apps/mobile/android
        env:
          GRADLE_OPTS: "-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"
          ORG_GRADLE_PROJECT_LEARNIFY_RELEASE_STORE_FILE: ${{ runner.temp }}/learnify-release.keystore
          ORG_GRADLE_PROJECT_LEARNIFY_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_LEARNIFY_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_LEARNIFY_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon -PreactNativeArchitectures=armeabi-v7a,arm64-v8a assembleRelease

      - name: Verify APK is not debug-signed
        working-directory: apps/mobile
        run: |
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)"
          APK="$(ls android/app/build/outputs/apk/release/*.apk | head -n 1)"
          CERTS="$("$APKSIGNER" verify --print-certs "$APK")"
          echo "$CERTS"
          if grep -q "CN=Android Debug" <<<"$CERTS"; then
            echo "::error::Release APK is signed with the debug key."
            exit 1
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: learnify-mobile-release-apk
          path: apps/mobile/android/app/build/outputs/apk/release/*.apk
          retention-days: 14

      - name: Prepare release asset
        if: startsWith(github.ref, 'refs/tags/')
        id: release_meta
        working-directory: apps/mobile
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION_TAG="${TAG#mobile-}"
          mkdir -p dist-apk
          APK_SOURCE="$(ls android/app/build/outputs/apk/release/*.apk | head -n 1)"
          VERSION_CODE="$(node -e "const app=require('./app.json'); const vc=app?.expo?.android?.versionCode; process.stdout.write(vc == null ? '' : String(vc));")"
          if [[ -n "$VERSION_CODE" ]]; then
            RELEASE_APK="dist-apk/learnify-mobile-${VERSION_TAG}-vc${VERSION_CODE}.apk"
          else
            RELEASE_APK="dist-apk/learnify-mobile-${VERSION_TAG}.apk"
          fi
          cp "$APK_SOURCE" "$RELEASE_APK"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "apk_path=apps/mobile/${RELEASE_APK}" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag }}
          name: Learnify Mobile ${{ steps.release_meta.outputs.tag }}
          generate_release_notes: true
          files: ${{ steps.release_meta.outputs.apk_path }}
          fail_on_unmatched_files: true

      - name: Build summary
        run: |
          echo "### Android release APK build complete" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Event: \`${GITHUB_EVENT_NAME}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Ref: \`${GITHUB_REF}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Variant: \`release\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Artifact: \`learnify-mobile-release-apk\`" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            echo "- Release: [${TAG}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${TAG})" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- Release: not published (run is not on a tag)." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "- Download artifact from this run's Artifacts section." >> "$GITHUB_STEP_SUMMARY"
